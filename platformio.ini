; PlatformIO wrapper for ESP32-Waveshare-SkippersWatch
; Builds this Arduino sketch from the repo root (src_dir = .)
; Board: Waveshare ESP32-S3-Touch-AMOLED-2.06 (ESP32-S3R8, 8 MB OPI PSRAM, 32 MB flash)
; Mirrors the README's Arduino IDE settings.

[platformio]
src_dir = .
default_envs = watch

[env:watch]
; pioarduino platform = Arduino-ESP32 core 3.3.11 (stock PlatformIO only ships core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Flash: 32 MB, QIO 80 MHz.  PSRAM: OPI.
board_upload.flash_size = 32MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
; Huge APP (3MB No OTA / 1MB SPIFFS)
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; Hardware CDC and JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1   ; USB CDC On Boot: Enabled
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}

; Keep host tests, docs and the SquareLine project out of the firmware build
build_src_filter = +<*> -<tests/> -<docs/> -<SLS_project_WS/> -<.github/> -<.pio/>

lib_deps =
    lvgl/lvgl@9.6.0
    moononournation/GFX Library for Arduino@1.6.9
    lewisxhe/XPowersLib@0.3.3
    bblanchon/ArduinoJson@7.4.3

upload_port = /dev/cu.usbmodem1401
monitor_port = /dev/cu.usbmodem1401
monitor_speed = 115200
