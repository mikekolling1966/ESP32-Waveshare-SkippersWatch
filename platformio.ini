; PlatformIO build for the Waveshare ESP32-S3-Touch-AMOLED-2.06 (SKU 31957).
; Mirrors the Arduino IDE settings in README.md "Installation":
;   ESP32S3 Dev Module, USB CDC On Boot = Enabled, Flash 32MB QIO 80MHz,
;   OPI PSRAM, Huge APP partition.
; Arduino core 3.3.11 comes from the pioarduino platform (the stock
; espressif32 platform stops at core 2.x).

[platformio]
src_dir = .
default_envs = waveshare_amoled_206

[env:waveshare_amoled_206]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 32MB
board_upload.maximum_size = 3145728
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

lib_deps =
    lvgl/lvgl@9.5.0
    moononournation/GFX Library for Arduino@1.6.7
    lewisxhe/XPowersLib@0.3.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}

; Sketch lives in the repo root; keep host tests, SquareLine project and docs out.
build_src_filter =
    +<*>
    -<tests/>
    -<SLS_project_WS/>
    -<docs/>
    -<.pio/>
    -<.git/>

monitor_speed = 115200
upload_speed = 921600
