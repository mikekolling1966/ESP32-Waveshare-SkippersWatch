# Tide times for Rochester (Strood Pier), UKHO station 0109B, from TidalPlan (port 8081 on
# this host, which calls the UKHO Admiralty API). Added 2026-11-05 for the SkippersWatch
# Tides page; the watch reads attributes.events (local midnight today + 7 days).
rest_command:
  strood_tides:
    url: >-
      http://127.0.0.1:8081/api/tides/stations/0109B/events?start={{ (today_at("00:00") | as_timestamp) | timestamp_custom("%Y-%m-%dT%H:%M:%S", false) }}&end={{ ((today_at("00:00") + timedelta(days=7)) | as_timestamp) | timestamp_custom("%Y-%m-%dT%H:%M:%S", false) }}
    method: get
    timeout: 60

template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: "/3"
        minutes: 5
    actions:
      - action: rest_command.strood_tides
        response_variable: tides
        continue_on_error: true
    sensor:
      - name: "Strood Tides"
        unique_id: strood_pier_tides
        icon: mdi:waves-arrow-up
        state: >-
          {% set ok = tides is defined and tides.status == 200 and tides.content is list %}
          {% set ev = tides.content if ok else (this.attributes.events if this.attributes.events is defined else []) %}
          {% set nxt = ev | selectattr("time", ">", utcnow().isoformat()) | list %}
          {{ (nxt | first).event_type if nxt else "unknown" }}
        attributes:
          station: "Rochester (Strood Pier)"
          station_id: "0109B"
          events: >-
            {% if tides is defined and tides.status == 200 and tides.content is list %}{{ tides.content }}{% else %}{{ this.attributes.events if this.attributes.events is defined else [] }}{% endif %}
          fetched: >-
            {% if tides is defined and tides.status == 200 %}{{ now().isoformat() }}{% else %}{{ this.attributes.fetched if this.attributes.fetched is defined else none }}{% endif %}
